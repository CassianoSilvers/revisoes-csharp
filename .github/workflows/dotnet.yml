name: Build e testes

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restaurar dependencias
        run: dotnet restore Revisoes-CSharp.slnx
      - name: Compilar
        run: dotnet build Revisoes-CSharp.slnx --configuration Release --no-restore
      - name: Executar testes
        run: dotnet test Revisoes-CSharp.slnx --configuration Release --no-build --verbosity normal
